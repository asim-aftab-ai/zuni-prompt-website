<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" width="64" height="64" shape-rendering="crispEdges">
  <rect width="8" height="8" fill="#131622" />
  <!-- Top horizontal bar -->
  <rect x="1" y="1" width="6" height="1" fill="#ffffff" />
  <!-- Diagonal pixel steps -->
  <rect x="4" y="2" width="2" height="1" fill="#ffffff" />
  <rect x="3" y="3" width="2" height="1" fill="#ffffff" />
  <rect x="2" y="4" width="2" height="1" fill="#ffffff" />
  <rect x="1" y="5" width="2" height="1" fill="#ffffff" />
  <!-- Bottom horizontal bar -->
  <rect x="1" y="6" width="6" height="1" fill="#ffffff" />
</svg>
